<svg xmlns="http://www.w3.org/2000/svg" width="880" height="194" viewBox="0 0 880 194"><rect x="0.5" y="0.5" width="879" height="193" rx="14" fill="#0f1b2d" stroke="#24364f"/><text x="28" y="32" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#4fd1d9">PROJETO EM DESTAQUE</text><text x="28" y="62" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#e8eef7">Comanda — copiloto financeiro do restaurante</text><text x="28" y="94" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b7f99">Agente de IA no Telegram que mostra ao dono de restaurante a margem real de cada prato, avisa quando o</text><text x="28" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b7f99">caixa vai ficar negativo e sugere o que fazer. Os números vêm de views SQL; a IA só explica. Testado com</text><text x="28" y="138" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6b7f99">12 perguntas de gabarito, incluindo armadilhas de alucinação.</text><text x="28" y="172" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#4fd1d9">Supabase  ·  n8n  ·  Groq  ·  Telegram  ·  v0 + Vercel</text></svg>